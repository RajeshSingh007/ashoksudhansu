name: Supabase keep-alive

# Supabase free projects pause after ~7 days of inactivity. This pings the
# database once a day so it never sleeps. Runs on GitHub's servers (free).
on:
  schedule:
    - cron: '17 3 * * *' # daily, ~03:17 UTC (off the top of the hour on purpose)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/thoughts?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $code"
          test "$code" = "200"
